name: Backlog and knowledge tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python app.py
      - run: python knowledge.py draft --ticket-id LAB-006 --author author-d --output output/kafka-draft.json
      - run: python knowledge.py approve --input output/kafka-draft.json --reviewer reviewer-e --tested-by tester-f --at 2026-10-03T00:00:00Z --output output/kafka-reviewed.json

      - run: python demo.py
